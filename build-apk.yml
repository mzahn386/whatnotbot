
name: Build Whatnot Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/whatnot-web-bot-kxVU4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd whatnot-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatnot-bot-apk
          path: whatnot-android/app/build/outputs/apk/debug/app-debug.apk
