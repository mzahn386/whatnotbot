name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/whatnot-web-bot-kxVU4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: whatnot-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatnot-debug-apk
          path: whatnot-android/app/build/outputs/apk/debug/app-debug.apk
